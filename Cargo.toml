[workspace]
resolver = "3"
members = [
  "crates/sourcetrait_cert_lib",
  "crates/sourcetrait_cert_cli",
]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["fs", "process", "signal", "user"] }
rcgen = { version = "0.14" }
serde = { version = "1", features = ["derive"] }
snafu = "0.8"
sourcetrait_cert_lib = { path = "crates/sourcetrait_cert_lib" }
time = { version = "0.3" }
toml = { version = "0.8" }
